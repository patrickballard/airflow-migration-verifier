name: Airflow 3 Migration Verifier
description: Verifies any Airflow 2→3 migration by rendering your templates on both versions; can migrate your DAGs too, in a PR.
author: patrickballard
branding:
  icon: check-circle
  color: blue
inputs:
  mode:
    description: "`migrate` (default): migrate the repo and open a PR. `verify`: check a migration done by anything, comparing the `before` and `after` trees; changes nothing."
    default: migrate
  before:
    description: "mode: verify. Path (in the workspace) of the Airflow 2 tree, e.g. the PR's base checked out to `before/`."
    required: false
  after:
    description: "mode: verify. Path of the migrated Airflow 3 tree, e.g. the PR's head checked out to `after/`."
    required: false
  strict:
    description: "mode: verify. Fail the step if a DAG doesn't import on Airflow 3, renders differently, or uses a removed DAG method or rejected kwarg."
    default: "false"
  github-token:
    description: Token used to push the bot branch and open the PR (needs contents + pull-requests write).
    default: ${{ github.token }}
  anthropic-api-key:
    description: "Claude API key for `fix: llm` rules. Without it those sites are listed as manual."
    required: false
  model:
    description: Claude model for LLM patches.
    default: claude-opus-5-5
  rules:
    description: "A bundled ruleset (openai, airflow) or a path to a rules YAML (repo-relative). Default: openai."
    required: false
  test-command:
    description: "'auto' detects pytest; 'none' disables the test gate."
    default: auto
  install-command:
    description: "Run inside the test venv before tests and after pin bumps. 'auto' installs requirements*.txt / the project + pytest."
    default: auto
  venv-dir:
    description: >-
      Where the test venv is created (kept separate from the action's own dependencies). The default is
      under /github/home, which is $RUNNER_TEMP/_github_home on the runner, so actions/cache can keep it
      (and the Airflow 2 render venv next to it, aca-venv-airflow2) between runs; see the README.
    default: /github/home/aca-venv
  branch:
    description: "Bot branch to push (default: api-change-agent/<package>). Pushing to main/master/the default or base branch is refused."
  base-branch:
    description: PR base. Defaults to the repo's default branch.
    required: false
  max-llm-usd:
    description: Hard cap on Claude spend for the whole run, in USD.
    default: "5"
  max-llm-attempts:
    description: Attempts per file for LLM patches (test failures are fed back).
    default: "2"
  exclude:
    description: Comma/newline separated globs (repo-relative) to skip.
    required: false
  dry-run:
    description: Report only; no commit, push or PR.
    default: "false"
outputs:
  pr-url:
    description: URL of the opened or updated PR (empty if none).
  changes:
    description: Number of rows in the change table.
  manual:
    description: Number of sites left for manual migration.
runs:
  using: docker
  image: Dockerfile
