# Rules for the openai Python SDK. Each rule: match pattern, fix type,
# minimum SDK version that supports the new form, changelog link.
package: openai
rules:
  - id: beta-chat-completions-to-ga
    description: >-
      `chat.completions.parse` and `.stream` moved out of `beta`. The beta
      alias still works (checked on openai 3.36.1, no warning), so this is
      forward-compat cleanup.
    match:
      attribute: "*.beta.chat.completions.{parse,stream}"
    fix: deterministic
    transform:
      drop_attribute: beta
    min_sdk_version: "1.92.0"
    changelog: https://github.com/openai/openai-python/releases/tag/v1.92.0

  - id: functions-to-tools
    description: >-
      `functions=` / `function_call=` are deprecated in favour of `tools=` /
      `tool_choice=`.
    match:
      call: "*.chat.completions.{create,parse,stream}"
      kwargs: [functions, function_call]
    fix: llm
    min_sdk_version: "1.1.0"
    changelog: https://github.com/openai/openai-python/releases/tag/v1.1.0
    guidance: |
      Migrate legacy function calling to tool calling:
      - `functions=[f, ...]` -> `tools=[{"type": "function", "function": f}, ...]`.
        If the list is built elsewhere, wrap at the call site (a comprehension
        is fine) rather than editing unrelated definitions.
      - `function_call="auto"` / `"none"` -> `tool_choice="auto"` / `"none"`.
      - `function_call={"name": N}` -> `tool_choice={"type": "function", "function": {"name": N}}`.
      - Response handling: `message.function_call` -> `message.tool_calls[0].function`
        (it has `.name` and `.arguments`); check `message.tool_calls` where the code
        checked `message.function_call` for None. Streaming deltas:
        `delta.function_call` -> `delta.tool_calls[i].function`.
      - `finish_reason == "function_call"` -> `finish_reason == "tool_calls"`.
      - Follow-up messages: `{"role": "function", "name": N, "content": C}` ->
        `{"role": "tool", "tool_call_id": <id of the tool call>, "content": C}`, and the
        assistant message that preceded it must carry `tool_calls` (append the
        returned assistant message as-is).
      Only touch code needed for this migration.

  - id: declare-httpx
    description: >-
      openai 3.0 switched to HTTPX2 and no longer installs `httpx`, so code
      that imports `httpx` itself fails with ModuleNotFoundError unless the
      repo declares it. Adds the range openai 1.x/2.x installed, so nothing
      already installed changes.
    match:
      import: httpx          # any .py file in the repo
      sdk_allows: ">=3.0.0"  # only if the openai pin (after this run's bumps) allows 3.x
    fix: deterministic
    transform:
      add_dependency: "httpx>=0.23.0,<1"
    min_sdk_version: "0"     # no openai bump needed for this fix
    changelog: https://github.com/openai/openai-python/releases/tag/v3.0.0
    note: "openai 3.0 no longer installs httpx; this repo imports it directly"
