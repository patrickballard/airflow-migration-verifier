name: ci
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"   # nightly: catches breakage from new Airflow, ruff or provider releases
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e '.[test]'
      - run: python -m pytest -q   # the real-Airflow tests skip themselves here (no ACA_AIRFLOW*_VENV)

  airflow:
    # The same suite plus the integration tests against real Airflow 2.11.2 and 3.3.2.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        id: py
        with:
          python-version: "3.12"
          cache: pip
      - uses: astral-sh/setup-uv@v10
      - uses: actions/cache@v6
        id: venvs
        with:
          path: ~/.aca-venvs
          # venvs hold absolute paths to this interpreter: the exact Python version is part of the key
          key: airflow-venvs-${{ runner.os }}-py${{ steps.py.outputs.python-version }}-af2.11.2-af3.3.2-v1
      - name: Build Airflow venvs (official constraints)
        if: steps.venvs.outputs.cache-hit != 'true'
        run: |
          for v in 2.11.2 3.3.2; do
            dir=~/.aca-venvs/airflow-${v%%.*}
            python -m venv "$dir"
            uv pip install -q --python "$dir/bin/python" "apache-airflow==$v" \
              -c "https://raw.githubusercontent.com/apache/airflow/constraints-$v/constraints-3.12.txt"
          done
      - run: pip install -e '.[test]'
      - run: |
          echo "ACA_AIRFLOW2_VENV=$HOME/.aca-venvs/airflow-2" >> "$GITHUB_ENV"
          echo "ACA_AIRFLOW3_VENV=$HOME/.aca-venvs/airflow-3" >> "$GITHUB_ENV"
      - name: Mutation tests of the render check (wrong migrations must never read as identical)
        run: python -m pytest -q tests/test_render_mutations.py
      - run: python -m pytest -q --ignore tests/test_render_mutations.py
      - name: examples/expected-output.md is what the verifier reports today
        run: |
          python -m api_change_agent verify --before examples --after examples \
            --venv "$ACA_AIRFLOW3_VENV" --old-venv "$ACA_AIRFLOW2_VENV" --output out > /dev/null
          diff -u examples/expected-output.md out/report.md

  example:
    # The action itself, as users run it (Docker image, venvs built from scratch), on examples/broken_dag.py.
    # Its job summary is the one in the README's screenshot.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./
        with:
          mode: verify
          before: examples
          after: examples
