name: tests
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e '.[test]'
      - run: python -m pytest -q   # the real-Airflow tests skip themselves here (no ACA_AIRFLOW*_VENV)

  airflow:
    # The same suite plus the integration tests against real Airflow 2.11.2 and 3.3.2.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: py
        with:
          python-version: "3.12"
          cache: pip
      - uses: astral-sh/setup-uv@v6
      - uses: actions/cache@v4
        id: venvs
        with:
          path: ~/.aca-venvs
          # venvs hold absolute paths to this interpreter: the exact Python version is part of the key
          key: airflow-venvs-${{ runner.os }}-py${{ steps.py.outputs.python-version }}-af2.11.2-af3.3.2-v1
      - name: Build Airflow venvs (official constraints)
        if: steps.venvs.outputs.cache-hit != 'true'
        run: |
          for v in 2.11.2 3.3.2; do
            dir=~/.aca-venvs/airflow-${v%%.*}
            python -m venv "$dir"
            uv pip install -q --python "$dir/bin/python" "apache-airflow==$v" \
              -c "https://raw.githubusercontent.com/apache/airflow/constraints-$v/constraints-3.12.txt"
          done
      - run: pip install -e '.[test]'
      - run: |
          echo "ACA_AIRFLOW2_VENV=$HOME/.aca-venvs/airflow-2" >> "$GITHUB_ENV"
          echo "ACA_AIRFLOW3_VENV=$HOME/.aca-venvs/airflow-3" >> "$GITHUB_ENV"
      - run: python -m pytest -q
